apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mealie-feeder-secret
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie-feeder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-backend
    kind: ClusterSecretStore
  target:
    name: mealie-feeder-secret
    template:
      type: Opaque
  data:
    - secretKey: MEALIE_API_TOKEN
      remoteRef:
        key: MEALIE_API_TOKEN
