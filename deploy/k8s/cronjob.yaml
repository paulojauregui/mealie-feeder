apiVersion: batch/v1
kind: CronJob
metadata:
  name: mealie-feeder-sync
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie-feeder
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mealie-feeder
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mealie-feeder
              image: ghcr.io/paulojauregui/mealie-feeder:latest
              args:
                - "--log-format=json"
                - "sync"
                - "--max-per-run=100"
              env:
                - name: MEALIE_URL
                  value: "http://mealie.mealie.svc.cluster.local:9000"
                - name: MEALIE_FEEDER_DB
                  value: "/var/lib/mealie-feeder/state.db"
                - name: MEALIE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: mealie-feeder-secret
                      key: MEALIE_API_TOKEN
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: state
                  mountPath: /var/lib/mealie-feeder
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: mealie-feeder-state
            - name: tmp
              emptyDir: {}
