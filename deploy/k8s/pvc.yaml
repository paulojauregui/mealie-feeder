apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-feeder-state
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie-feeder
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
